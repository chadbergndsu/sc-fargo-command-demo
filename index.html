<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SC Fargo Command — Dan Bryant</title>
<meta name="theme-color" content="#5ecf3e"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--s:#5ecf3e;--sd:#3daa28;--ss:#e8f9e0;--a:#ff6b35;--as:#fff0e9;--fg:#1a2e14;--m:#4a6350;--w:#fff;--b:#d4e8cb;--bg:#f0f9ec}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.45}
.mesh{min-height:100dvh;background:radial-gradient(ellipse 80% 50% at 10% -10%,rgba(94,207,62,.18),transparent),var(--bg)}
.w{max-width:960px;margin:0 auto;padding:1.1rem 1rem 2.5rem}.fd{font-family:Fredoka,system-ui,sans-serif}
.btn{display:inline-flex;align-items:center;font-weight:700;border:0;cursor:pointer;border-radius:.9rem;padding:.65rem 1.05rem;font-family:inherit}
.bp{background:var(--s);color:#fff}.bs{background:var(--w);border:1px solid var(--b)}
.card{background:var(--w);border:1px solid var(--b);border-radius:.9rem;padding:.9rem;box-shadow:0 3px 12px rgba(62,140,40,.07)}
.g{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.nav{display:flex;flex-wrap:wrap;gap:.2rem;padding:.35rem;background:var(--w);border:1px solid var(--b);border-radius:.9rem;margin:0 0 .9rem}
.nav button{padding:.4rem .65rem;border-radius:.55rem;border:0;background:0;font-weight:700;color:var(--m);cursor:pointer;font-family:inherit}
.nav button.on{background:var(--s);color:#fff}
.sv{font-family:Fredoka,system-ui;font-size:1.35rem;font-weight:700}.sl{font-size:.72rem;color:var(--m);font-weight:700}
.muted{color:var(--m)}.subtle{color:#7a9180;font-size:.78rem}
.badge{display:inline-block;padding:.12rem .5rem;border-radius:999px;font-size:.62rem;font-weight:800;text-transform:uppercase;background:var(--ss);color:var(--sd)}
table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{padding:.45rem .5rem;border-bottom:1px solid var(--b);text-align:left}
th{font-size:.62rem;text-transform:uppercase;color:#7a9180}
.pill{padding:.08rem .4rem;border-radius:999px;font-size:.62rem;font-weight:800;background:var(--as);color:var(--a)}
.ok{background:var(--ss);color:var(--sd)}
.bar{display:flex;gap:.5rem;align-items:center;margin:.35rem 0}.bl{width:4.5rem;font-size:.68rem;font-weight:700;color:var(--m)}
.bt{flex:1;height:.5rem;background:#eef6ea;border-radius:99px;overflow:hidden;border:1px solid var(--b)}
.bf{height:100%;background:linear-gradient(90deg,var(--s),#7de05c)}.bv{font-size:.68rem;font-weight:800;width:2rem;text-align:right}
h1{font-family:Fredoka,system-ui;font-size:clamp(1.5rem,4vw,2.3rem);margin:.55rem 0;line-height:1.15}
</style></head><body><div id="app" class="mesh"></div>
<script src="/app.js"></script></body></html>

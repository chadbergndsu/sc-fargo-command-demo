<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SC Fargo Command — Dan Bryant</title>
<meta name="theme-color" content="#5ecf3e"/>
<meta name="description" content="SC Fargo Command zero-draft for Dan Bryant — Slime City Fargo ops + loyalty"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f3fbf5;--elev:#fff;--subtle:#e5f6ea;--surface2:#eef9f1;
  --fg:#16301f;--muted:#4a6b56;--subtle-fg:#7a9a86;
  --border:#cfe8d6;--border-strong:#a8d4b6;
  --p:#5ecf3e;--p-dim:#3fa828;--p-soft:#d8f7c8;--p-fg:#0c2a0a;
  --accent:#ff6bab;--accent-soft:#ffe0ef;
  --warn:#f0a020;--danger:#e85a6b;--info:#4aa8e8;
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:22px;--r-2xl:28px;
  --sh:0 10px 28px rgb(22 48 31 / .08),0 2px 8px rgb(94 207 62 / .08);
  --sh-sm:0 1px 3px rgb(22 48 31 / .06);
  --font:Nunito,system-ui,-apple-system,sans-serif;
  --display:Fredoka,Nunito,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{
  min-height:100dvh;font-family:var(--font);background:var(--bg);color:var(--fg);
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,a{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.mesh{
  min-height:100dvh;
  background:
    radial-gradient(ellipse 90% 55% at 8% -8%,rgba(94,207,62,.22),transparent 55%),
    radial-gradient(ellipse 70% 45% at 100% 0%,rgba(255,107,171,.10),transparent 50%),
    radial-gradient(ellipse 50% 40% at 50% 100%,rgba(74,168,232,.08),transparent 45%),
    var(--bg);
}
.wrap{width:100%;max-width:72rem;margin:0 auto;padding:1.25rem 1rem calc(2.5rem + var(--safe-b))}
@media(min-width:640px){.wrap{padding:1.75rem 1.5rem 3rem}}
.fd{font-family:var(--display)}
.logo{
  width:3rem;height:3rem;border-radius:1rem;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(145deg,#6fd94a 0%,#5ecf3e 45%,#3fa828 100%);
  color:var(--p-fg);box-shadow:var(--sh-sm),inset 0 1px 0 rgba(255,255,255,.35);
}
.logo svg{width:1.35rem;height:1.35rem}
.card{
  background:var(--elev);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);padding:1rem;
}
.card-soft{background:color-mix(in oklab,var(--accent-soft) 55%,#fff);border-color:color-mix(in oklab,var(--accent) 22%,var(--border))}
.card-mint{background:color-mix(in oklab,var(--p-soft) 50%,#fff)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:2.75rem;padding:.65rem 1.15rem;border-radius:999px;border:0;
  font-weight:800;font-size:.92rem;transition:transform .15s ease,background .15s ease,box-shadow .15s ease;
}
.btn:active{transform:scale(.98)}
.bp{background:var(--p);color:#fff;box-shadow:0 6px 16px rgba(63,168,40,.25)}
.bp:hover{background:var(--p-dim)}
.bs{background:var(--elev);color:var(--fg);border:1px solid var(--border);box-shadow:var(--sh-sm)}
.bs:hover{background:var(--subtle)}
.bghost{background:transparent;color:var(--accent);padding:0;min-height:auto;font-size:.8rem}
.badge{
  display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .65rem;border-radius:999px;
  font-size:.65rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
}
.b-m{background:var(--elev);border:1px solid var(--border);color:var(--muted)}
.b-s{background:var(--p-soft);color:var(--p-dim)}
.b-a{background:var(--accent-soft);color:var(--accent)}
.g2{display:grid;gap:.75rem;grid-template-columns:1fr}
.g3{display:grid;gap:.75rem;grid-template-columns:1fr}
.g4{display:grid;gap:.65rem;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:640px){
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(min-width:900px){
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.sv{font-family:var(--display);font-size:1.55rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sl{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:.15rem}
.muted{color:var(--muted)}.subtle{color:var(--subtle-fg);font-size:.8rem}
h1{font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:1.12;
  font-size:clamp(1.85rem,5.2vw,2.75rem);margin:.65rem 0 .75rem}
h2{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
.nav{
  display:flex;gap:.3rem;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:.35rem;background:var(--elev);border:1px solid var(--border);border-radius:var(--r-xl);
  margin:0 0 1rem;box-shadow:var(--sh-sm);scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  flex:0 0 auto;padding:.55rem .85rem;border-radius:999px;border:0;background:transparent;
  font-weight:800;font-size:.82rem;color:var(--muted);white-space:nowrap;min-height:2.5rem;
}
.nav button.on{background:var(--p);color:#fff;box-shadow:0 4px 12px rgba(63,168,40,.22)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}
.icon-box{
  width:2.5rem;height:2.5rem;border-radius:var(--r-md);display:grid;place-items:center;flex-shrink:0;
  background:var(--elev);border:1px solid var(--border);color:var(--p-dim);box-shadow:var(--sh-sm);
}
.icon-box.a{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.icon-box svg{width:1.1rem;height:1.1rem}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:.65rem .55rem;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--subtle-fg);font-weight:800}
tr:last-child td{border-bottom:0}
.pill{display:inline-flex;padding:.12rem .5rem;border-radius:999px;font-size:.68rem;font-weight:800}
.pg{background:var(--p-soft);color:var(--p-dim)}.po{background:#fff1df;color:#c47a00}.pr{background:#fde8eb;color:var(--danger)}
.bar{display:flex;align-items:center;gap:.55rem;margin:.45rem 0}
.bl{width:3.2rem;font-size:.72rem;font-weight:800;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.bt{flex:1;height:.55rem;background:var(--subtle);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bf{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p-dim),var(--p))}
.bv{width:2rem;text-align:right;font-size:.72rem;font-weight:800;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.fade{animation:in .28s cubic-bezier(.22,1,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.btn:active{transform:none}}
.footer-note{margin-top:1.5rem;font-size:.78rem;color:var(--subtle-fg)}
.chip-row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 0}
.delta{font-size:.72rem;font-weight:800;color:var(--p-dim)}
.delta.down{color:var(--danger)}
</style>
</head>
<body>
<div id="app" class="mesh"></div>
<script>
(function(){
"use strict";
var page="home";
var S={g:412,r:18420,t:44.7,f:68,w:17,loyalty:286,vip:34};
var H=[["10a",18],["11a",42],["12p",78],["1p",95],["2p",88],["3p",102],["4p",74],["5p",55]];
var W=[
  ["Johnson family",1840,"94d","High","Free pizza + 4 passes"],
  ["Prairie View PTA",4200,"61d","Med","Group rate lock-in"],
  ["Northside Softball",2900,"78d","High","Team night 20% off"],
  ["Chen household",960,"112d","High","2x points weekend"]
];
var L=[["Mon",62,8,8],["Tue",58,7,7],["Wed",71,8,9],["Thu",88,9,10],["Fri",110,11,13],["Sat",145,14,16],["Sun",128,13,14]];
var P=[["Emma R.",8,"Mar 14","Deposit",420],["Liam K.",7,"Mar 15","Inquiry",380],["Sophia T.",9,"Mar 21","Won",510],["Ava M.",10,"Mar 28","Radar",450]];
var A=[
  ["Cold families 15–30 mi","B3G1 wristbands","SMS + FB","+$2.1k","urgent"],
  ["Birthday kids 7–10","$50 off deposit","Email + IG","+$4.4k","high"],
  ["Corporate HR Fargo","Team night package","LinkedIn","+$3.2k","med"]
];
var V=[["First Glow Night","Fri 8–11p",28,40,"Open"],["Pixel After-Hours","Sat 9p–12a",34,35,"Nearly full"]];
var PLAN=[
  ["1. Roller data","Tickets + food POS as they hit Roller — not week-old reports."],
  ["2. Visitor intel","Groups, drive distance, weekday mix, every spend lever."],
  ["3. Outside signals","Weather, schools, tournaments, competitor offers."],
  ["4. Ads that pay","Who, offer, channel, why now, expected lift."],
  ["5. Track & tweak","Live ROI. Agents re-score and cut waste."],
  ["6–7. Loyalty + VIP","Points on everything. Votes on attractions. Glow nights."]
];
var OT=[["ops","Overview"],["winback","Win-back"],["labor","Labor"],["parties","Parties"],["ads","Ads"],["vip","VIP"]];
var AT=[["app","Wallet"],["rewards","Rewards"],["vote","Vote"]];

function money(n){return "$"+n.toLocaleString()}
function go(p){page=p;render();window.scrollTo(0,0)}
function iconDrop(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7c.3 3.4 2 6 4.2 7.8A6.8 6.8 0 0 1 12 21.3a6.8 6.8 0 0 1-4.2-10.8C10 8.7 11.7 6.1 12 2.7z"/></svg>';
}
function icon(name){
  var m={
    users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    heart:'<path d="M19 14c1.5-1.4 3-3.1 3-5.4A5.5 5.5 0 0 0 16.5 3c-1.5 0-2.7.6-3.5 1.6C12.2 3.6 11 3 9.5 3A5.5 5.5 0 0 0 4 8.6c0 2.3 1.5 4 3 5.4l5 4.6z"/>',
    users2:'<path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.4-2-6.3-5-7.5"/>',
    cake:'<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2 1 2 1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/>',
    meg:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
    crown:'<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/>',
    home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+m[name]+'</svg>';
}

function home(){
  return '<div class="wrap fade">'+
    '<div class="topbar">'+
      '<div class="brand"><div class="logo">'+iconDrop()+'</div>'+
      '<div><div class="fd" style="font-weight:700;font-size:1.1rem">SC Fargo Command</div>'+
      '<div class="subtle">Built for Dan Bryant · Fargo, ND</div></div></div>'+
      '<span class="badge b-m">Confidential · exclusive</span></div>'+
    '<span class="badge b-s">7-point plan + 3 extras</span>'+
    '<h1>Perfect Fargo.<br/>Then buy parks and double revenue.</h1>'+
    '<p class="muted" style="max-width:36rem;font-size:1.02rem;margin-bottom:1.1rem">Roller-connected intelligence, ads that pay, win-back, labor forecast, party radar, VIP + guest loyalty — ready for your walkthrough.</p>'+
    '<div class="row" style="margin-bottom:1.5rem">'+
      '<button class="btn bp" type="button" data-go="ops">Operator command →</button>'+
      '<button class="btn bs" type="button" data-go="app">Guest loyalty app</button></div>'+
    '<p class="subtle" style="margin-bottom:1rem">Suggested path: Overview → Win-back → Labor → Parties → Guest app</p>'+
    '<div class="g3" style="margin-bottom:1rem">'+PLAN.map(function(x){
      return '<div class="card"><div class="fd" style="font-size:.95rem;margin-bottom:.35rem">'+x[0]+'</div><p class="muted" style="font-size:.88rem">'+x[1]+'</p></div>';
    }).join('')+'</div>'+
    '<div class="g3" style="margin-bottom:1rem">'+
      cardExtra("Win-back radar","Catch high-LTV guests going cold before they book the competitor. Draft offers ready.","winback","heart")+
      cardExtra("Labor & capacity","7-day crew forecast from weather, parties, and events — lock the roster before the rush.","labor","users2")+
      cardExtra("Birthday & party radar","Highest ticket. Pipeline 6–8 weeks out: radar → deposit → won.","parties","cake")+
    '</div>'+
    '<div class="card card-soft" style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between">'+
      '<div style="min-width:min(100%,18rem)"><div class="row" style="gap:.4rem;margin-bottom:.35rem"><span class="icon-box a">'+icon("crown")+'</span><span class="badge b-a">VIP pipeline</span></div>'+
      '<div class="fd" style="font-size:1.05rem;margin-bottom:.25rem">First Glow Night, Pixel after-hours</div>'+
      '<p class="muted" style="font-size:.9rem">Invite VIPs, track RSVPs, keep exclusives tight. Guests vote on attractions before CapEx.</p></div>'+
      '<button class="btn bp" type="button" data-go="vip">Open VIP events</button></div>'+
    '<p class="footer-note">Demo data only · Not live park data · For Dan Bryant only</p></div>';
}
function cardExtra(t,d,p,ic){
  return '<div class="card card-soft"><div class="icon-box a" style="margin-bottom:.65rem">'+icon(ic)+'</div>'+
    '<div class="fd" style="font-size:.95rem;margin-bottom:.3rem">'+t+'</div>'+
    '<p class="muted" style="font-size:.88rem;margin-bottom:.55rem">'+d+'</p>'+
    '<button class="btn bghost" type="button" data-go="'+p+'">Open →</button></div>';
}
function shell(title,sub,tabs,body){
  return '<div class="wrap fade">'+
    '<div class="topbar">'+
      '<div><div class="fd" style="font-weight:700;font-size:1.05rem">'+title+'</div><div class="subtle">'+sub+'</div></div>'+
      '<button class="btn bs" type="button" data-go="home" style="min-height:2.4rem;padding:.45rem .9rem;font-size:.82rem">← Home</button></div>'+
    '<div class="nav">'+tabs.map(function(t){
      return '<button type="button" class="'+(page===t[0]?"on":"")+'" data-go="'+t[0]+'">'+t[1]+'</button>';
    }).join('')+'</div>'+body+'</div>';
}
function body(){
  if(page==="ops"){
    return '<div class="stack">'+
      '<div><h2>Overview</h2><p class="muted" style="margin-top:.25rem;font-size:.9rem">Live park pulse · agents ready</p></div>'+
      '<div class="g4">'+
        stat("412","Guests today","+8% vs last Sat")+
        stat(money(18420),"Revenue · today","+12%")+
        stat("$44.7","Avg ticket","Food attach 68%")+
        stat("286 / 34","Loyalty / VIP","Avg distance 18.4 mi")+
      '</div>'+
      '<div class="card"><div class="fd" style="margin-bottom:.75rem">Hourly traffic</div>'+
        H.map(function(h){return bar(h[0],h[1]);}).join('')+
      '</div>'+
      '<div class="g3">'+
        '<div class="card"><div class="row" style="margin-bottom:.4rem"><span class="icon-box a">'+icon("heart")+'</span><strong style="font-size:.9rem">Win-back</strong></div><div class="sv">17</div><div class="sl">High-LTV cooling</div><button class="btn bghost" style="margin-top:.5rem" data-go="winback">Open →</button></div>'+
        '<div class="card"><div class="row" style="margin-bottom:.4rem"><span class="icon-box a">'+icon("users2")+'</span><strong style="font-size:.9rem">Labor gaps</strong></div><div class="sv">+5</div><div class="sl">Fri–Sun crew needed</div><button class="btn bghost" style="margin-top:.5rem" data-go="labor">Open →</button></div>'+
        '<div class="card"><div class="row" style="margin-bottom:.4rem"><span class="icon-box a">'+icon("cake")+'</span><strong style="font-size:.9rem">Party pipeline</strong></div><div class="sv">$1.8k</div><div class="sl">Open value this month</div><button class="btn bghost" style="margin-top:.5rem" data-go="parties">Open →</button></div>'+
      '</div></div>';
  }
  if(page==="winback"){
    return '<div class="stack"><div><h2>Win-back radar</h2><p class="muted" style="margin-top:.25rem">'+S.w+' high-LTV accounts cooling off</p></div>'+
      '<div class="card scroll"><table><thead><tr><th>Account</th><th>LTV</th><th>Last</th><th>Risk</th><th>Draft offer</th></tr></thead><tbody>'+
      W.map(function(w){
        return '<tr><td style="font-weight:800">'+w[0]+'</td><td>'+money(w[1])+'</td><td>'+w[2]+'</td><td><span class="pill '+(w[3]==="High"?"po":"pg")+'">'+w[3]+'</span></td><td>'+w[4]+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
  }
  if(page==="labor"){
    return '<div class="stack"><div><h2>Labor & capacity</h2><p class="muted" style="margin-top:.25rem">7-day forecast before the rush</p></div>'+
      '<div class="card scroll"><table><thead><tr><th>Day</th><th>Demand</th><th>Staff</th><th>Need</th><th>Status</th></tr></thead><tbody>'+
      L.map(function(l){
        var g=l[3]-l[2];
        return '<tr><td style="font-weight:800">'+l[0]+'</td><td>'+l[1]+'</td><td>'+l[2]+'</td><td>'+l[3]+'</td><td><span class="pill '+(g>0?"po":"pg")+'">'+(g>0?("+"+g+" needed"):"Covered")+'</span></td></tr>';
      }).join('')+'</tbody></table></div></div>';
  }
  if(page==="parties"){
    return '<div class="stack"><div><h2>Party pipeline</h2><p class="muted" style="margin-top:.25rem">Radar → deposit → won</p></div>'+
      '<div class="card scroll"><table><thead><tr><th>Kid</th><th>Age</th><th>Date</th><th>Stage</th><th>Value</th></tr></thead><tbody>'+
      P.map(function(p){
        return '<tr><td style="font-weight:800">'+p[0]+'</td><td>'+p[1]+'</td><td>'+p[2]+'</td><td>'+p[3]+'</td><td>'+money(p[4])+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
  }
  if(page==="ads"){
    return '<div class="stack"><div><h2>Ads that pay</h2><p class="muted" style="margin-top:.25rem">Who · offer · channel · expected lift</p></div><div class="g3">'+
      A.map(function(a){
        return '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:.35rem"><strong style="font-size:.9rem">'+a[0]+'</strong><span class="pill '+(a[4]==="urgent"?"pr":"pg")+'">'+a[3]+'</span></div>'+
          '<p class="muted" style="font-size:.88rem">'+a[1]+' · '+a[2]+'</p></div>';
      }).join('')+'</div></div>';
  }
  if(page==="vip"){
    return '<div class="stack"><div><h2>VIP events</h2><p class="muted" style="margin-top:.25rem">Glow nights & Pixel after-hours</p></div><div class="g2">'+
      V.map(function(v){
        var pct=Math.round(v[2]/v[3]*100);
        return '<div class="card card-soft"><div class="fd" style="font-size:1.05rem">'+v[0]+'</div><div class="subtle" style="margin:.25rem 0 .5rem">'+v[1]+'</div>'+
          '<div class="sv" style="font-size:1.25rem">'+v[2]+'/'+v[3]+' RSVPs</div>'+
          '<div class="bt" style="margin:.55rem 0"><div class="bf" style="width:'+pct+'%"></div></div>'+
          '<span class="pill pg">'+v[4]+'</span></div>';
      }).join('')+'</div></div>';
  }
  if(page==="app"){
    return '<div class="stack"><div><h2>Guest wallet</h2><p class="muted" style="margin-top:.25rem">What a family sees after Saturday</p></div>'+
      '<div class="g4">'+stat("1,240","Points","Gold tier")+stat("Gold","Tier","Top 12%")+stat("$62","Avg spend","This month")+stat("4","Visits / mo","+1 vs last")+
      '</div><div class="card card-mint"><p class="muted" style="font-size:.92rem">Points earn on tickets <strong>and</strong> food. VIP nights unlock at Gold. Kids can vote on the next attraction before you spend CapEx.</p></div></div>';
  }
  if(page==="rewards"){
    return '<div class="stack"><div><h2>Rewards</h2><p class="muted" style="margin-top:.25rem">Redeem without awkward counters</p></div><div class="g3">'+
      '<div class="card"><strong>Free slime upgrade</strong><div class="subtle" style="margin-top:.3rem">200 pts · Owned</div><span class="pill pg" style="margin-top:.55rem">Ready</span></div>'+
      '<div class="card"><strong>Pizza slice</strong><div class="subtle" style="margin-top:.3rem">350 pts</div><span class="pill b-m" style="margin-top:.55rem;background:var(--subtle);color:var(--muted)">350 to go</span></div>'+
      '<div class="card"><strong>Guest pass</strong><div class="subtle" style="margin-top:.3rem">800 pts</div><span class="pill b-m" style="margin-top:.55rem;background:var(--subtle);color:var(--muted)">800 to go</span></div>'+
      '</div></div>';
  }
  if(page==="vote"){
    return '<div class="stack"><div><h2>Guest vote</h2><p class="muted" style="margin-top:.25rem">What should we build next?</p></div>'+
      '<div class="card">'+[["New glow slide",142],["Pixel hole 7",98],["Foam pit",87]].map(function(n){
        return '<div class="bar"><div class="bl" style="width:8.5rem">'+n[0]+'</div><div class="bt"><div class="bf" style="width:'+Math.min(100,n[1]/1.5)+'%"></div></div><div class="bv">'+n[1]+'</div></div>';
      }).join('')+'</div></div>';
  }
  return '';
}
function stat(v,l,d){
  return '<div class="card"><div class="sv">'+v+'</div><div class="sl">'+l+'</div>'+(d?'<div class="delta" style="margin-top:.35rem">'+d+'</div>':'')+'</div>';
}
function bar(label,v){
  return '<div class="bar"><div class="bl">'+label+'</div><div class="bt"><div class="bf" style="width:'+v+'%"></div></div><div class="bv">'+v+'</div></div>';
}
function render(){
  var el=document.getElementById("app");
  if(!el) return;
  if(page==="home") el.innerHTML=home();
  else if(page==="app"||page==="rewards"||page==="vote") el.innerHTML=shell("SC Fargo · Guest app","Loyalty · rewards · votes",AT,body());
  else el.innerHTML=shell("SC Fargo · Operator command","Park intelligence for Dan Bryant",OT,body());
  var nodes=el.querySelectorAll("[data-go]");
  for(var i=0;i<nodes.length;i++){
    nodes[i].addEventListener("click",function(ev){
      go(ev.currentTarget.getAttribute("data-go"));
    });
  }
}
render();
})();
</script>
</body>
</html>
